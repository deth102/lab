<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chỉnh logo — ITD Signal-Gear</title>
<!--
  ===================================================================
  DEMO ĐỘC LẬP — double-click mở bằng trình duyệt, KHÔNG cần build.
  Logo "ITD Signal-Gear": bánh răng phẳng quay + tín hiệu rung trôi
  ngang, đục rãnh xuyên bánh răng.

  Kéo các thanh trượt bên phải để chỉnh:
   • Kích thước bánh răng (bán kính, số răng)
   • Tín hiệu: tần số, biên độ, độ rộng rãnh đục
   • Độ đậm nét bánh răng + nét tín hiệu
   • Màu component (color picker) + theme sáng/tối

  Khi ưng, bấm "📋 Copy số" → dán cho mình để áp vào code thật.
  ===================================================================
-->
<style>
  :root{
    --brand:#0e7490; --highlight:#f59e0b;
    --bg:#ffffff; --fg:#0a0a0a; --muted:#6b7280;
  }
  html.dark{ --brand:#22d3ee; --highlight:#fbbf24; --bg:#0a0a0a; --fg:#fafafa; --muted:#9ca3af; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex}

  @keyframes wave-scroll{from{transform:translateX(0)}to{transform:translateX(-100px)}}
  .wave-scroll{animation:wave-scroll var(--dw,4s) linear infinite;will-change:transform}
  @media (prefers-reduced-motion:reduce){.wave-scroll{animation:none}}

  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;padding:40px}
  .logo{color:var(--brand)}
  .big{filter:drop-shadow(0 0 30px color-mix(in oklab,var(--brand) 25%,transparent))}
  .row-sizes{display:flex;align-items:flex-end;gap:40px;flex-wrap:wrap;justify-content:center}
  .chip{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);font-size:12px}
  .navbar-demo{display:flex;align-items:center;gap:10px;padding:12px 18px;
    border:1px solid color-mix(in oklab,var(--fg) 12%,transparent);border-radius:12px}
  .navbar-demo b{font-size:16px;letter-spacing:-.01em}

  .panel{width:300px;flex-shrink:0;height:100vh;overflow-y:auto;padding:20px;
    background:color-mix(in oklab,var(--bg) 92%,transparent);
    border-left:1px solid color-mix(in oklab,var(--fg) 14%,transparent);
    backdrop-filter:blur(8px)}
  .panel h2{margin:0 0 4px;font-size:16px}
  .panel .sub{margin:0 0 18px;font-size:12px;color:var(--muted)}
  .group{margin-bottom:18px}
  .group .gt{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
    margin-bottom:8px;border-bottom:1px solid color-mix(in oklab,var(--fg) 10%,transparent);padding-bottom:4px}
  .ctl{margin-bottom:11px}
  .ctl label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
  .ctl label b{color:var(--brand)}
  .ctl input[type=range]{width:100%;accent-color:var(--brand)}
  .ctl.color{display:flex;align-items:center;justify-content:space-between}
  .ctl.color input[type=color]{width:42px;height:28px;border:none;background:none;cursor:pointer}
  .btns{display:flex;gap:8px;margin-top:8px}
  button{flex:1;padding:9px;border-radius:9px;cursor:pointer;font-size:12px;
    border:1px solid color-mix(in oklab,var(--fg) 20%,transparent);background:transparent;color:var(--fg)}
  button:hover{border-color:var(--brand);color:var(--brand)}
  #out{margin-top:12px;padding:10px;border-radius:8px;font-family:ui-monospace,monospace;font-size:10.5px;
    white-space:pre-wrap;background:color-mix(in oklab,var(--fg) 6%,transparent);color:var(--muted);line-height:1.5}
</style>
</head>
<body>

  <div class="stage">
    <div class="logo big" id="hero"></div>
    <div class="row-sizes">
      <div class="chip"><div class="logo" id="s64"></div>64px</div>
      <div class="chip"><div class="logo" id="s32"></div>32px (navbar)</div>
      <div class="chip"><div class="logo" id="s16"></div>16px (favicon)</div>
    </div>
    <div class="navbar-demo"><div class="logo" id="snav"></div><b>ITD Lab</b></div>
  </div>

  <div class="panel">
    <h2>⚙️ Chỉnh logo</h2>
    <p class="sub">Kéo trượt → xem ngay. Ưng thì bấm Copy số.</p>

    <div class="group">
      <div class="gt">Bánh răng</div>
      <div class="ctl"><label>Bán kính (răng) <b id="vRP">74</b></label>
        <input id="rP" type="range" min="36" max="80" step="1" value="74"></div>
      <div class="ctl"><label>Độ cao răng <b id="vH">24</b></label>
        <input id="h" type="range" min="6" max="28" step="1" value="24"></div>
      <div class="ctl"><label>Số răng <b id="vN">13</b></label>
        <input id="N" type="range" min="8" max="24" step="1" value="13"></div>
      <div class="ctl"><label>Lỗ trục <b id="vBORE">19</b></label>
        <input id="bore" type="range" min="6" max="34" step="1" value="19"></div>
    </div>

    <div class="group">
      <div class="gt">Tín hiệu rung</div>
      <div class="ctl"><label>Tần số (số dao động) <b id="vCYC">6</b></label>
        <input id="cyc" type="range" min="2" max="16" step="1" value="6"></div>
      <div class="ctl"><label>Biên độ <b id="vAMP">18</b></label>
        <input id="amp" type="range" min="6" max="50" step="1" value="18"></div>
      <div class="ctl"><label>Điều biến (beat) <b id="vBEAT">0.35</b></label>
        <input id="beat" type="range" min="0" max="0.8" step="0.05" value="0.35"></div>
      <div class="ctl"><label>Độ dài tín hiệu <b id="vWLEN">160</b></label>
        <input id="wlen" type="range" min="60" max="200" step="2" value="160"></div>
      <div class="ctl"><label>Vị trí dọc (offset Y) <b id="vYOFF">0</b></label>
        <input id="yoff" type="range" min="-60" max="60" step="2" value="0"></div>
      <div class="ctl"><label>Độ rộng rãnh đục <b id="vCUT">9</b></label>
        <input id="cut" type="range" min="0" max="22" step="1" value="9"></div>
      <div class="ctl"><label>Tốc độ trôi (giây) <b id="vSPD">5</b></label>
        <input id="spd" type="range" min="1.5" max="10" step="0.5" value="5"></div>
    </div>

    <div class="group">
      <div class="gt">Nét & độ đậm</div>
      <div class="ctl"><label>Nét bánh răng <b id="vGSW">5</b></label>
        <input id="gsw" type="range" min="2" max="10" step="0.5" value="5"></div>
      <div class="ctl"><label>Nét tín hiệu <b id="vWSW">1.5</b></label>
        <input id="wsw" type="range" min="1" max="8" step="0.5" value="1.5"></div>
      <div class="ctl"><label>Độ đặc thân răng <b id="vFILL">0.06</b></label>
        <input id="fill" type="range" min="0" max="0.6" step="0.02" value="0.06"></div>
      <div class="ctl"><label>Tốc độ quay (giây) <b id="vROT">28</b></label>
        <input id="rot" type="range" min="6" max="60" step="2" value="28"></div>
    </div>

    <div class="group">
      <div class="gt">Màu (chọn riêng từng phần)</div>
      <div class="ctl color"><label>Màu bánh răng</label>
        <input id="colGear" type="color" value="#0e7490"></div>
      <div class="ctl color"><label>Màu tín hiệu</label>
        <input id="colWave" type="color" value="#06b6d4"></div>
      <div class="ctl color"><label>Màu điểm nhấn</label>
        <input id="colAmber" type="color" value="#f59e0b"></div>
      <div class="ctl"><label style="font-size:11px;color:var(--muted)">Nền xem thử</label></div>
      <div class="btns"><button id="bgLight">Nền sáng</button><button id="bgDark">Nền tối</button></div>
    </div>

    <div class="btns">
      <button id="theme">🌙 Dark</button>
      <button id="reset">↺ Mặc định</button>
    </div>
    <button id="copy" style="width:100%;margin-top:8px">📋 Copy số</button>
    <div id="out"></div>
  </div>

<script>
  const $=id=>document.getElementById(id);
  const root=document.documentElement;

  // ---------- generators ----------
  function gearPath(N, rP, h){
    const rO=rP+h/2, rR=rP-h/2, tipFrac=0.42;
    const P=(r,a)=>`${(r*Math.sin(a)).toFixed(2)},${(-r*Math.cos(a)).toFixed(2)}`;
    const half=Math.PI/N, tip=half*tipFrac;
    let d="M";
    for(let i=0;i<N;i++){const c=i*2*Math.PI/N;
      const v=[P(rR,c-half),P(rO,c-tip),P(rO,c+tip),P(rR,c+half)];
      for(const p of v) d+=` ${p} L`;}
    return d.replace(/ L$/," Z");
  }
  // Visible wave: ONE finite trace of length `len`, centred at x=0,
  // shifted vertically by `yoff`. Length should be ≤ gear diameter.
  function wavePoints(cyc, amp, beatDepth, len, yoff){
    const half=len/2;
    const carrier=Math.PI*2*cyc/len;     // `cyc` full cycles across the length
    const beat=Math.PI*2/len;            // 1 beat envelope across the length
    const lo=1-beatDepth;
    let pts=[];
    for(let x=-half;x<=half;x+=2){
      const env=lo+beatDepth*Math.abs(Math.sin(beat*(x+half)));
      pts.push(`${x.toFixed(1)},${(yoff-amp*env*Math.sin(carrier*(x+half))).toFixed(2)}`);
    }
    return pts.join(" ");
  }
  // Long scrolling band for the carved groove (loops over period 100).
  function bandPoints(cyc, amp, beatDepth, yoff){
    const carrier=Math.PI*2*cyc/100, beat=Math.PI*2/100;
    const lo=1-beatDepth;
    let pts=[];
    for(let x=-200;x<=400;x+=2){
      const env=lo+beatDepth*Math.abs(Math.sin(beat*x));
      pts.push(`${x},${(yoff-amp*env*Math.sin(carrier*x)).toFixed(2)}`);
    }
    return pts.join(" ");
  }

  let MID=0;
  function logoSVG(size, P){
    const GC=P.colGear, WC=P.colWave, AC=P.colAmber;
    const dia=2*(P.rP+P.h/2);            // gear outer diameter
    const len=Math.min(P.wlen, dia);     // trace length ≤ diameter
    if(size<28){ // favicon silhouette
      return `<svg viewBox="-100 -100 200 200" width="${size}" height="${size}" fill="none" stroke="${GC}" stroke-width="4">
        <circle r="88"/><circle r="${Math.max(16,P.bore+6)}" fill="${GC}" stroke="none"/>
        <circle cx="0" cy="-60" r="9" fill="${AC}" stroke="none"/></svg>`;
    }
    const gear=gearPath(P.N,P.rP,P.h);
    const wave=wavePoints(P.cyc,P.amp,P.beat,len,P.yoff);
    if(size<64){ // navbar: flat gear + simple static trace
      return `<svg viewBox="-100 -100 200 200" width="${size}" height="${size}" fill="none"
          stroke-linejoin="round" stroke-linecap="round">
        <g stroke="${GC}"><path d="${gear}" fill="none" stroke-width="${(P.gsw-0.5).toFixed(1)}" vector-effect="non-scaling-stroke"/>
          <circle r="${P.bore}" fill="${GC}" stroke="none"/>
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="${(P.rot*1.4)}s" repeatCount="indefinite"/></g>
        <polyline points="${wavePoints(P.cyc,P.amp,P.beat,len,P.yoff)}" fill="none" stroke="${WC}" stroke-width="4" vector-effect="non-scaling-stroke"/>
        <circle cx="-40" cy="${(P.yoff-20).toFixed(1)}" r="6" fill="${AC}" stroke="none"/></svg>`;
    }
    const mid="m"+(MID++);
    const half=len/2, y0=P.yoff, gap=P.amp;
    // TWO straight parallel lines carve a fixed band (gap = amplitude).
    const cut = P.cut>0 ? `<defs><mask id="${mid}" maskUnits="userSpaceOnUse" x="-100" y="-100" width="200" height="200">
        <rect x="-100" y="-100" width="200" height="200" fill="white"/>
        <line x1="${-half}" y1="${y0-gap/2}" x2="${half}" y2="${y0-gap/2}" stroke="black" stroke-width="${P.cut}" stroke-linecap="round"/>
        <line x1="${-half}" y1="${y0+gap/2}" x2="${half}" y2="${y0+gap/2}" stroke="black" stroke-width="${P.cut}" stroke-linecap="round"/>
      </mask></defs>` : "";
    const maskAttr = P.cut>0 ? ` mask="url(#${mid})"` : "";
    // ONE signal trace scrolling through the band (clipped to the band).
    const band=bandPoints(P.cyc,P.amp,P.beat,y0);
    return `<svg viewBox="-100 -100 200 200" width="${size}" height="${size}" fill="none"
        stroke-linejoin="round" stroke-linecap="round">
      ${cut}
      <clipPath id="${mid}c"><rect x="${-half}" y="${y0-gap/2-4}" width="${len}" height="${gap+8}"/></clipPath>
      <g${maskAttr}><g stroke="${GC}">
        <path d="${gear}" fill="${GC}" fill-opacity="${P.fill}" stroke="none"/>
        <path d="${gear}" fill="none" stroke="${GC}" stroke-width="${P.gsw}" vector-effect="non-scaling-stroke"/>
        <circle r="${P.bore}" fill="${GC}" fill-opacity="${P.fill}" stroke="${GC}" stroke-width="4"/>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="${P.rot}s" repeatCount="indefinite"/>
      </g></g>
      <g clip-path="url(#${mid}c)">
        <polyline class="wave-scroll" points="${band}" fill="none" stroke="${WC}" stroke-width="${P.wsw}" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      </g>
    </svg>`;
  }

  // ---------- read params + render ----------
  function params(){
    return {
      rP:+$("rP").value, h:+$("h").value, N:+$("N").value, bore:+$("bore").value,
      cyc:+$("cyc").value, amp:+$("amp").value, beat:+$("beat").value, cut:+$("cut").value,
      wlen:+$("wlen").value, yoff:+$("yoff").value,
      gsw:+$("gsw").value, wsw:+$("wsw").value, fill:+$("fill").value, rot:+$("rot").value,
      spd:+$("spd").value,
      colGear:$("colGear").value, colWave:$("colWave").value, colAmber:$("colAmber").value,
    };
  }
  function render(){
    const P=params();
    root.style.setProperty("--dw", P.spd+"s");
    MID=0;
    $("hero").innerHTML=logoSVG(150,P);
    $("s64").innerHTML=logoSVG(64,P);
    $("s32").innerHTML=logoSVG(32,P);
    $("s16").innerHTML=logoSVG(16,P);
    $("snav").innerHTML=logoSVG(32,P);
    // update value labels
    const m={rP:"RP",h:"H",N:"N",bore:"BORE",cyc:"CYC",amp:"AMP",beat:"BEAT",cut:"CUT",
             wlen:"WLEN",yoff:"YOFF",gsw:"GSW",wsw:"WSW",fill:"FILL",rot:"ROT",spd:"SPD"};
    for(const k in m) $("v"+m[k]).textContent=$(k).value;
    dump(P);
  }
  function dump(P){
    $("out").textContent =
`Bánh răng: rP=${P.rP} h=${P.h} N=${P.N} lỗ=${P.bore}
Tín hiệu: ${P.cyc} dao động, amp=${P.amp}, beat=${P.beat}
Độ dài=${P.wlen}, vị trí Y=${P.yoff}, 2 đường cách nhau=${P.amp}
Rãnh đục=${P.cut}, trôi=${P.spd}s
Nét: gear=${P.gsw} sóng=${P.wsw} fill=${P.fill} quay=${P.rot}s
Màu bánh răng: ${P.colGear}
Màu tín hiệu: ${P.colWave}
Màu điểm nhấn: ${P.colAmber}`;
  }

  // bind all range inputs + color pickers → re-render (colors live in SVG now)
  document.querySelectorAll('input[type=range],input[type=color]')
    .forEach(i=>i.addEventListener("input",render));

  // background-only toggles (preview gear/wave colors on light vs dark bg)
  $("bgLight").onclick=()=>root.classList.remove("dark");
  $("bgDark").onclick=()=>root.classList.add("dark");
  $("theme").onclick=e=>{root.classList.toggle("dark");
    e.target.textContent=root.classList.contains("dark")?"☀️ Light":"🌙 Dark";};

  $("reset").onclick=()=>{
    const def={rP:74,h:24,N:13,bore:19,cyc:6,amp:18,beat:0.35,wlen:160,yoff:0,cut:9,gsw:5,wsw:1.5,fill:0.06,rot:28,spd:5};
    for(const k in def) $(k).value=def[k];
    $("colGear").value="#0e7490"; $("colWave").value="#06b6d4"; $("colAmber").value="#f59e0b";
    render();
  };
  $("copy").onclick=()=>{
    navigator.clipboard?.writeText($("out").textContent);
    $("copy").textContent="✓ Đã copy"; setTimeout(()=>$("copy").textContent="📋 Copy số",1500);
  };

  render();
</script>
</body>
</html>
